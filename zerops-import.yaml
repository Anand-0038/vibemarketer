# Phase 1 infrastructure for the existing VibeMarketer web application.
# Application build/run behavior lives in the root zerops.yaml.
services:
  - hostname: web
    type: nodejs@22
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minCpu: 1
      maxCpu: 2
      cpuMode: SHARED
      minRam: 1
      maxRam: 2
      minDisk: 2
      maxDisk: 8
    override: true
