# Private publishing worker. It has no public port; it reaches web through
# Zerops' project network at http://web:3000.
services:
  - hostname: worker
    type: nodejs@22
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minCpu: 1
      maxCpu: 2
      cpuMode: SHARED
      minRam: 1
      maxRam: 2
      minDisk: 2
      maxDisk: 8
    override: true
